<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img">
  <title>바이브 코딩을 위한 다섯 가지</title>
  <desc>설계는 비교하고, 결과는 다른 눈으로 확인하고, 목표는 먼저 적고, 문서는 상태를 나누고, 모르는 방법은 질문으로 남긴다.</desc>
  <rect width="1200" height="760" rx="28" fill="#071018"/>
  <text x="64" y="72" fill="#8ee7ef" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="20" letter-spacing="2">FIVE CHECKS</text>
  <text x="64" y="124" fill="#f4f1ea" font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif" font-size="36" font-weight="700">바이브 코딩을 위한 다섯 가지</text>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Malgun Gothic, sans-serif">
    <rect x="48" y="176" width="350" height="230" rx="20" fill="#102033" stroke="#36e7f0" stroke-width="2"/>
    <text x="76" y="224" fill="#36e7f0" font-size="18">01</text>
    <text x="76" y="270" fill="#f4f1ea" font-size="30" font-weight="700">설계 비교</text>
    <text x="76" y="322" fill="#c9d4df" font-size="18">중요한 구조는</text>
    <text x="76" y="352" fill="#c9d4df" font-size="18">최대 4개 세션에서 비교</text>

    <rect x="426" y="176" width="350" height="230" rx="20" fill="#102033" stroke="#fee75c" stroke-width="2"/>
    <text x="454" y="224" fill="#fee75c" font-size="18">02</text>
    <text x="454" y="270" fill="#f4f1ea" font-size="30" font-weight="700">결과 검증</text>
    <text x="454" y="322" fill="#c9d4df" font-size="18">다른 관점으로 점검하고</text>
    <text x="454" y="352" fill="#c9d4df" font-size="18">실제 실행도 확인</text>

    <rect x="804" y="176" width="348" height="230" rx="20" fill="#102033" stroke="#ff5ebc" stroke-width="2"/>
    <text x="832" y="224" fill="#ff5ebc" font-size="18">03</text>
    <text x="832" y="270" fill="#f4f1ea" font-size="30" font-weight="700">목표 구체화</text>
    <text x="832" y="322" fill="#c9d4df" font-size="18">원하는 동작과</text>
    <text x="832" y="352" fill="#c9d4df" font-size="18">완료 기준을 정리</text>

    <rect x="230" y="446" width="350" height="230" rx="20" fill="#102033" stroke="#c9b6ff" stroke-width="2"/>
    <text x="258" y="494" fill="#c9b6ff" font-size="18">04</text>
    <text x="258" y="540" fill="#f4f1ea" font-size="30" font-weight="700">문서 관리</text>
    <text x="258" y="592" fill="#c9d4df" font-size="18">계획, 구현, 검증을 나누고</text>
    <text x="258" y="622" fill="#c9d4df" font-size="18">바뀔 때마다 다시 확인</text>

    <rect x="620" y="446" width="350" height="230" rx="20" fill="#102033" stroke="#ff9ad4" stroke-width="2"/>
    <text x="648" y="494" fill="#ff9ad4" font-size="18">05</text>
    <text x="648" y="540" fill="#f4f1ea" font-size="30" font-weight="700">모르는 건 질문</text>
    <text x="648" y="592" fill="#c9d4df" font-size="18">구현 방법은 가설로 묻고</text>
    <text x="648" y="622" fill="#c9d4df" font-size="18">맞는지는 실행으로 확인</text>
  </g>
</svg>
